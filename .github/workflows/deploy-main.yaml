name: Deploy to Elastic Beanstalk Main
on:
  push:
    branches:
      - main

env:
  AWS_REGION: af-south-1
  EB_APPLICATION_NAME: Whizz-Away
  EB_ENVIRONMENT_NAME: Whizz-Away-env
  S3_BUCKET_NAME: whizz-away-versions-prod
  DEPLOYMENT_PACKAGE: whizz-${{ github.sha }}.zip
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: |
            client/node_modules
            server/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install client dependencies
        run: cd apps/client-whizz/client && npm install

      - name: Set React environment variables
        run: |
          cd apps/client-whizz/client
          echo "REACT_APP_API_URL=https://ksm-whizz-away.co.za" > .env

      - name: Build React app
        run: cd apps/client-whizz/client && CI=false npm run build

      - name: Vendor shared workspace packages into server bundle
        run: |
          # EB reinstalls the server bundle in isolation and cannot see packages/*
          # that live outside apps/client-whizz/server, so copy the shared packages
          # in and repoint the file: dependency at the vendored path (inside the zip).
          rm -rf apps/client-whizz/server/_packages
          mkdir -p apps/client-whizz/server/_packages
          cp -r packages/core apps/client-whizz/server/_packages/core
          cd apps/client-whizz/server && npm pkg set 'dependencies.@whizz/core=file:./_packages/core'

      - name: Install server dependencies
        run: cd apps/client-whizz/server && npm install

      - name: Move React build to server
        run: |
          rm -rf apps/client-whizz/server/public
          mkdir -p apps/client-whizz/server/public
          mv apps/client-whizz/client/build apps/client-whizz/server/public
          mv apps/client-whizz/.platform apps/client-whizz/server/

      - name: Generate deployment package
        run: cd apps/client-whizz/server && zip -r ../../../${{ env.DEPLOYMENT_PACKAGE }} . -x '*.git*' *.env* '*.log' '*.md' 'node_modules/*' 'client/node_modules/*'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 cp ${{ env.DEPLOYMENT_PACKAGE }} s3://${{ env.S3_BUCKET_NAME }}/

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          version_label: ${{ github.sha }}
          region: ${{ env.AWS_REGION }}
          deployment_package: ${{ env.DEPLOYMENT_PACKAGE }}
